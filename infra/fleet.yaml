apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: vortex-v1
  namespace: vortex
spec:
  replicas: 6
  scheduling: Packed
  template:
    metadata:
      labels:
        vortex.dev/build: v1
    spec:
      ports:
        - name: game
          portPolicy: Dynamic
          containerPort: 8080
          protocol: TCP
      health:
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          terminationGracePeriodSeconds: 30
          nodeSelector:
            vortex.dev/pool: game
          containers:
            - name: game
              image: REGISTRY/vortex:v1 # replace with an immutable digest
              env:
                - { name: AGONES, value: "true" }
                - name: MATCH_ID
                  valueFrom: { fieldRef: { fieldPath: "metadata.name" } }
                - name: TICKET_SECRET
                  valueFrom: { secretKeyRef: { name: vortex-tickets, key: secret } }
                - { name: ALLOWED_ORIGINS, value: "https://play.example.com" }
              resources:
                requests: { cpu: "1", memory: "192Mi" }
                limits: { cpu: "1", memory: "192Mi" }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
---
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: vortex-v1-buffer
  namespace: vortex
spec:
  fleetName: vortex-v1
  policy:
    type: Buffer
    buffer:
      bufferSize: 6
      minReplicas: 6
      maxReplicas: 200
  sync:
    type: FixedInterval
    fixedInterval: { seconds: 5 }
